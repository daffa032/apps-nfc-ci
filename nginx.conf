server {
    listen 80;
    root /app/public;
    index index.php;

    client_max_body_size 10M; # above the app's own 5MB upload validation, so
                               # a too-large upload gets the app's own error
                               # page instead of a bare nginx 413.

    # phpMyAdmin is a separate app entirely; proxy it before the CI4 rules
    # below ever see the request.
    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }

    # ^~ forces this prefix match to win over the regex `location ~ \.php$`
    # below. Without it, nginx's normal precedence (regex beats prefix) sends
    # /phpmyadmin/index.php to the app's own PHP-FPM instead of here, which
    # looks for a file that doesn't exist in the app container and replies
    # "File not found." — a 404 that has nothing to do with phpMyAdmin itself.
    location ^~ /phpmyadmin/ {
        proxy_pass http://phpmyadmin/;
        # $host deliberately omits the port; $http_host preserves it. Without
        # this, the backend sees "Host: localhost" instead of
        # "Host: localhost:8080" and some of its own redirects/links drop
        # the port, sending the browser to the wrong URL.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mirrors public/.htaccess: serve a real file/directory as-is (assets,
    # uploads, favicon); everything else goes through the front controller.
    # CI4's indexPage is '' (app/Config/App.php), so URLs never contain
    # index.php and this rewrite must not add it back into $uri.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Defense in depth: .htaccess/.env etc. are irrelevant under nginx+FPM,
    # but block dotfiles so a stray one is never served as a static download.
    location ~ /\. {
        deny all;
    }
}
