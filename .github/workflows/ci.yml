name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, json
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  analyse:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, json
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NFC_TEST_DB: nfc_repo_test
      NFC_TEST_DB_HOST: 127.0.0.1
      NFC_TEST_DB_USER: root
      NFC_TEST_DB_PASS: ''

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, json, mysqli, sqlite3
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/phpunit --no-coverage
