<section class="tpl-stack">
  <div class="tpl-hero tpl-stack tpl-center">
    <div>{{photo}}</div>
    <h2 class="tpl-title">{{name}}</h2>
    <p>{{company}}</p>
  </div>
  <div class="tpl-panel tpl-stack">
    <h3>Hubungi saya</h3>
    <div>{{contact}}</div>
  </div>
  <div class="tpl-panel tpl-stack">
    <h3>Galeri</h3>
    <div>{{gallery}}</div>
  </div>
  <div class="tpl-panel tpl-stack">
    <h3>Tautan sosial</h3>
    <div>{{social}}</div>
  </div>
  <div class="tpl-divider">{{actions}}</div>
</section>
